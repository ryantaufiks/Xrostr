name: xrostr

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: xrostr_owner
      POSTGRES_PASSWORD: xrostr_owner_dev
      POSTGRES_DB: xrostr
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U xrostr_owner -d xrostr']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
