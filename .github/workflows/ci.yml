name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner).
      - run: pnpm turbo run build typecheck test
      - name: Schema and migrations are in sync
        run: |
          pnpm --filter @inroster/db generate
          git diff --exit-code -- packages/db/migrations
