<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Offline · Xrostr</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #f1f1ef;
        font:
          18px/1.6 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        text-align: center;
        padding: 24px;
      }
      h1 {
        font:
          700 28px/1.2 ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.04em;
        margin: 16px 0 8px;
      }
      p {
        color: #b9b9b4;
        margin: 0 0 24px;
      }
      button {
        font:
          700 15px ui-monospace,
          Menlo,
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: #f1f1ef;
        color: #000;
        border: 0;
        border-radius: 999px;
        min-height: 48px;
        padding: 0 28px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>Tidak ada koneksi</h1>
      <p>Periksa internet Anda, lalu coba lagi.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </main>
  </body>
</html>
